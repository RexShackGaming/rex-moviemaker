<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="letterbox" class="hidden"><div class="bar top"></div><div class="bar bottom"></div></div>

<div id="flyhud" class="hidden">
  <div class="crosshair">+</div>
  <div class="flykeys">
    <span><b data-l="ui_key_wasd"></b> <i data-l="ui_k_move"></i></span>
    <span><b data-l="ui_key_qz"></b> <i data-l="ui_k_updown"></i></span>
    <span><b data-l="ui_key_xc"></b> <i data-l="ui_k_roll"></i></span>
    <span><b data-l="ui_key_scroll"></b> <i data-l="ui_k_zoom"></i></span>
    <span><b data-l="ui_key_shiftctrl"></b> <i data-l="ui_k_speed"></i></span>
    <span><b data-l="ui_key_e"></b> <i data-l="ui_k_add"></i></span>
    <span><b data-l="ui_key_f"></b> <i data-l="ui_k_focus"></i></span>
    <span><b data-l="ui_key_backspace"></b> <i data-l="ui_k_editor"></i></span>
    <span class="fov"><i data-l="ui_fov"></i> <b id="flyFov">50</b></span>
  </div>
</div>

<div id="app" class="hidden">
  <div class="panel">
    <div class="header">
      <button class="circle" id="btnFly" data-lt="ui_fly">&#9673;</button>
      <div class="titles"><h1 data-l="ui_title"></h1><div class="sub" data-l="ui_subtitle"></div></div>
      <button class="circle" id="btnClose" data-lt="ui_close">&#10005;</button>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="keys" data-l="ui_tab_keys"></button>
      <button class="tab" data-tab="fx" data-l="ui_tab_fx"></button>
      <button class="tab" data-tab="focus" data-l="ui_tab_focus"></button>
      <button class="tab" data-tab="scenes" data-l="ui_tab_scenes"></button>
    </div>
    <div class="divider"><span>&#10022;</span></div>

    <section id="tab-keys" class="tabpage">
      <div class="actions">
        <button class="wood" id="btnAdd" data-l="ui_add_here"></button>
        <button class="wood" id="btnPlay">&#9654; <span data-l="ui_play"></span></button>
        <button class="wood muted" id="btnClear" data-l="ui_clear"></button>
      </div>
      <div class="toggles">
        <label><input type="checkbox" id="setLoop"> <span data-l="ui_loop"></span></label>
        <label><input type="checkbox" id="setHide"> <span data-l="ui_hide_player"></span></label>
      </div>
      <div class="total" id="keyTotal"></div>
      <div id="keyList" class="list"></div>
    </section>

    <section id="tab-fx" class="tabpage hidden">
      <div class="field"><label data-l="ui_timecycle"></label>
        <div class="dd editable" id="ddTc"><input id="fxTc" data-lp="ui_timecycle_ph" autocomplete="off"><span class="dd-arrow">&#9662;</span><div class="dd-menu"></div></div></div>
      <div class="field"><label><span data-l="ui_tc_strength"></span> <em id="tcVal">1.00</em></label><input type="range" id="fxTcS" min="0" max="1" step="0.05"></div>
      <div class="field"><label data-l="ui_postfx"></label>
        <div class="dd editable" id="ddPfx"><input id="fxPfx" data-lp="ui_postfx_ph" autocomplete="off"><span class="dd-arrow">&#9662;</span><div class="dd-menu"></div></div></div>
      <div class="field"><label data-l="ui_shake"></label>
        <div class="dd" id="ddShake"><div class="dd-value"></div><span class="dd-arrow">&#9662;</span><div class="dd-menu"></div></div></div>
      <div class="field"><label><span data-l="ui_shake_amp"></span> <em id="shVal">0</em></label><input type="range" id="fxShakeA" min="0" max="5" step="0.1"></div>
      <div class="field"><label><span data-l="ui_letterbox"></span> <em id="lbVal">0%</em></label><input type="range" id="fxLb" min="0" max="25" step="1"></div>
      <div class="row2">
        <div class="field"><label data-l="ui_fade_in"></label><input type="number" id="fxFi" min="0" max="10000" step="100"></div>
        <div class="field"><label data-l="ui_fade_out"></label><input type="number" id="fxFo" min="0" max="10000" step="100"></div>
      </div>
      <div class="actions">
        <button class="wood" id="btnFxPrev" data-l="ui_preview"></button>
        <button class="wood muted" id="btnFxClear" data-l="ui_clear_preview"></button>
      </div>
    </section>

    <section id="tab-focus" class="tabpage hidden">
      <p class="desc" data-l="ui_focus_desc"></p>
      <div class="status" id="focusStatus" data-l="ui_focus_none"></div>
      <div class="actions">
        <button class="wood" id="btnFocusSelf" data-l="ui_focus_me"></button>
        <button class="wood muted" id="btnFocusClear" data-l="ui_focus_clear"></button>
      </div>
    </section>

    <section id="tab-scenes" class="tabpage hidden">
      <div class="field"><label data-l="ui_scene_name"></label><input id="sceneName" maxlength="40" data-lp="ui_scene_ph"></div>
      <div class="actions"><button class="wood" id="btnSave" data-l="ui_save"></button></div>
      <div id="sceneList" class="list"></div>
    </section>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
